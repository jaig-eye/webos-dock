    <ellipse cx="88" cy="73" rx="5" ry="3.4" fill="#D9846C" opacity="0.3"/>
    <!-- whisker pads -->
    <ellipse cx="58.5" cy="82.2" rx="9.8" ry="7.4" fill="#B39575"/>
    <ellipse cx="58.5" cy="81" rx="9.4" ry="6.8" fill="#C9AC8A"/>
