<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" width="260" height="150">
  <title>Pip's cane rod, line and bobber (pivot at the handle end, 14 30)</title>
  <defs>
    <radialGradient id="pipr-bob" cx="0.66" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#20140F" stop-opacity="0.38"/>
    </radialGradient>
    <clipPath id="pipr-bobc"><circle cx="240" cy="141" r="6.5"/></clipPath>
    <clipPath id="pipr-rodc"><path d="M13.18 27.11Q119.74 -1.88 200.04 3.25L199.96 4.75Q120.26 1.88 14.82 32.89A3 3 0 0 1 13.18 27.11Z"/></clipPath>
  </defs>

  <!-- fishing line, a gentle sag from the tip to the bobber -->
  <path d="M200 4.2Q223 50 240 130.4" stroke="#EDE6D6" stroke-width="0.9" fill="none" opacity="0.75" stroke-linecap="round"/>

  <!-- bamboo cane, tapering, bent a touch under the line's weight -->
  <path d="M13.18 27.11Q119.74 -1.88 200.04 3.25L199.96 4.75Q120.26 1.88 14.82 32.89A3 3 0 0 1 13.18 27.11Z" fill="#C9A66B"/>
  <g clip-path="url(#pipr-rodc)">
    <path d="M14.4 31.4Q120.1 1 200 4.3L200 8L14 36Z" fill="#9E7C46"/>
    <path d="M13.4 27.6Q119.8 -1.2 200 3.5L200 0L13 24Z" fill="#E8CE93"/>
  </g>
  <!-- cane nodes -->
  <path d="M58.77 15.71L59.99 21.17M94.24 9.07L95.04 13.81M127.98 4.64L128.44 8.64M160.03 2.44L160.19 5.64" stroke="#86622F" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M60.6 15.4L61.6 20.4M96 8.8L96.6 13.4M129.7 4.5L130 8.4" stroke="#E2C78C" stroke-width="0.7" stroke-linecap="round" opacity="0.8"/>

  <!-- cord-wrapped grip at the handle end -->
  <path d="M13.08 26.73L34.12 21.15L35.76 27.53L14.92 33.27A3.4 3.4 0 0 1 13.08 26.73Z" fill="#6B4A2E"/>
  <path d="M18.34 25.34L20.13 31.84M23.6 23.94L25.34 30.4M28.86 22.55L30.55 28.97" stroke="#8C6642" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M13.6 27.4L34.3 21.9" stroke="#93704A" stroke-width="0.8" stroke-linecap="round"/>

  <!-- red-and-white bobber, floating -->
  <rect x="239.3" y="130" width="1.4" height="5.2" fill="#EFE7DA"/>
  <circle cx="240" cy="130.2" r="1.1" fill="#C8432F"/>
  <path d="M233.5 141A6.5 6.5 0 0 1 246.5 141Z" fill="#C8432F"/>
  <path d="M233.5 141A6.5 6.5 0 0 0 246.5 141Z" fill="#F2EDE4"/>
  <g clip-path="url(#pipr-bobc)">
    <rect x="232" y="140.2" width="16" height="1.6" fill="#8E2A1E" opacity="0.55"/>
    <circle cx="240" cy="141" r="6.5" fill="url(#pipr-bob)"/>
    <!-- waterline at box y 145 (scene 505) -->
    <rect x="232" y="145" width="16" height="4" fill="#1D3442" opacity="0.5"/>
  </g>
  <ellipse cx="242.4" cy="137.4" rx="1.8" ry="1.1" fill="#FFF3E6" opacity="0.7"/>
</svg>
