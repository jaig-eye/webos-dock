<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" width="110" height="100">
  <title>Pip closed eyelids for pip-head-down.svg (blink overlay, bonus)</title>
  <defs>
    <clipPath id="pipld-lc">
      <ellipse cx="50.5" cy="59" rx="9.9" ry="11.2"/>
      <ellipse cx="77.5" cy="58.2" rx="8.9" ry="10.4"/>
    </clipPath>
    <linearGradient id="pipld-hs2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24150E" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#24150E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#24150E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#pipld-lc)">
    <!-- the same fur, cheek light and brim shadow that surround the eyes on pip-head-down.svg -->
    <rect x="38" y="44" width="52" height="30" fill="#5B3A29"/>
    <ellipse cx="82" cy="72" rx="10" ry="7" fill="#694431"/>
    <path d="M0 40C30 42 80 42 110 40L110 53C90 50.5 70 49.5 55 49.5C40 49.5 20 50.5 0 53Z" fill="url(#pipld-hs2)"/>
    <ellipse cx="51" cy="55.6" rx="7.2" ry="4.6" fill="#6A4532" opacity="0.35"/>
    <ellipse cx="78" cy="54.8" rx="6.2" ry="4.4" fill="#6A4532" opacity="0.35"/>
  </g>
  <!-- lash lines -->
  <path d="M42.2 60.6C45.4 65.2 55.6 65.4 59 60.8" stroke="#2A1A12" stroke-width="1.9" stroke-linecap="round" fill="none"/>
  <path d="M43 61.8L40.8 63.6" stroke="#2A1A12" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M70 60C73 64.4 82 64.6 85.2 60" stroke="#2A1A12" stroke-width="1.9" stroke-linecap="round" fill="none"/>
  <path d="M84.4 61.2L86.6 63" stroke="#2A1A12" stroke-width="1.3" stroke-linecap="round"/>
</svg>
