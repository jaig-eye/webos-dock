    <g transform="rotate(-10 46 56)">
      <path d="M22 53C22 44 26 36 38 34C46 32.6 56 33 62 36C68 39 70 45 69 53Z" fill="#D9B65A"/>
      <path d="M22 53C22 44 26 36 38 34C33 38 30 44 30 53Z" fill="#BE9B48"/>
      <path d="M56 33.8C62 34.8 67 38 68.4 43C65 40.4 61 38 57 36.6Z" fill="#ECD48A"/>
      <path d="M22.2 47C34 49.5 56 49.5 69.2 46.8L69 53C56 55 34 55 22 53Z" fill="#B08A3A"/>
      <path d="M8 58C10 52 24 50 45 50.4C66 50.8 80 53 82.5 58C84 62 80 64 75 62.8C62 59.6 30 59 16 63C10 64.6 7 62 8 58Z" fill="#D9B65A"/>
      <path d="M16 63C30 59 62 59.6 75 62.8C80 64 84 62 82.5 58C81.6 60.6 78.4 61.2 74.6 60.4C62 57.4 30 56.6 15.4 60.4C11 61.4 8.4 60.6 8 58C7 62 10 64.6 16 63Z" fill="#A98A3D"/>
      <path d="M12.6 57.4C28 53.6 66 54 79 57" stroke="#C2A04B" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- paw holding the blanket edge up to his chin -->
  <ellipse cx="83" cy="80" rx="7.2" ry="5.4" fill="#5B3A29" transform="rotate(-28 83 80)"/>
  <path d="M78.6 78.4C80.6 76.2 85 75 88.4 76.4" stroke="#76513A" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M81.2 80.4L84 84.4M84.6 78.6L87.8 82.2" stroke="#2A1A12" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
