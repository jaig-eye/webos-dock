      <ellipse cx="41" cy="89.4" rx="7.8" ry="5.9" fill="#B39575"/>
      <ellipse cx="41" cy="88.4" rx="7.4" ry="5.4" fill="#C9AC8A"/>
      <ellipse cx="52.4" cy="89.2" rx="7.4" ry="5.9" fill="#B39575"/>
      <ellipse cx="52.4" cy="88.2" rx="7" ry="5.4" fill="#C9AC8A"/>
