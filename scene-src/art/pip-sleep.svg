    <path d="M35 87C30.6 85.8 27 85.6 23 86.2M35.4 90C31.4 90.4 27.8 91.6 24.4 93.4M58.4 86.6C62.6 85.4 66.2 85 70 85.4M58.2 89.8C62 90.2 65.4 91.2 68.6 93" stroke="#F2E6D0" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.85"/>
