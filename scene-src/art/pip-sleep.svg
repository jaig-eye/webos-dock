    <path d="M28.4 74.2C30.4 69.6 37.6 69.6 39.6 74.2M51.6 73.6C53.6 69 60.8 69 62.8 73.6" stroke="#2A1A12" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- nose, mouth, whiskers -->
    <path d="M40.6 79.2C40.6 75.8 52.4 75.6 52.7 78.8C52.9 81.7 49.4 84.3 46.8 84.3C44.2 84.3 40.6 82.5 40.6 79.2Z" fill="#2A1A12"/>
    <ellipse cx="47.2" cy="77.8" rx="2.4" ry="1" fill="#6E574A" opacity="0.9"/>
