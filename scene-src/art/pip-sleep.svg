    <path d="M96 54C90 66 88 86 92 108.5L95.4 108.5C91.6 87 93 67 98.6 54.4Z" fill="#2A1E1A" opacity="0.18"/>
    <path d="M80.4 60C83 74 83.6 90 85.6 108" stroke="#F1E8D6" stroke-width="0.9" stroke-dasharray="2.4 2" fill="none" opacity="0.6"/>
