<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 110" width="220" height="110">
  <title>Pip asleep under his patchwork blanket</title>
  <defs>
    <radialGradient id="pips-cs" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#120A06" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#120A06" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pips-bshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1E1A" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#2A1E1A" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2A1E1A" stop-opacity="0.34"/>
    </linearGradient>
    <clipPath id="pips-blc"><path d="M54 108.5C52 90 58 70 74 60C86 53 100 54 112 52C122 44 140 39 156 41C176 44 194 56 200 74C204 86 203 100 200 108.5Z"/></clipPath>
