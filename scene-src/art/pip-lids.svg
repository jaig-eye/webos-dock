<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" width="110" height="100">
  <title>Pip closed eyelids for pip-head.svg (blink overlay)</title>
  <defs>
    <clipPath id="pipl-lc">
      <ellipse cx="63" cy="53" rx="9.7" ry="10.9"/>
      <ellipse cx="89.5" cy="50.5" rx="7.6" ry="10"/>
    </clipPath>
    <linearGradient id="pipl-hs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24150E" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#24150E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#24150E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#pipl-lc)">
    <!-- the same fur, cheek light and brim shadow that surround the eyes on pip-head.svg -->
    <rect x="50" y="38" width="50" height="28" fill="#5B3A29"/>
    <ellipse cx="75" cy="61" rx="11" ry="7" fill="#694431"/>
    <path d="M0 33C30 31 80 32 110 38L110 48C96 45 80 43.5 60 43.5C40 43.5 20 45 0 47.5Z" fill="url(#pipl-hs)"/>
    <!-- soft lid bulge -->
    <ellipse cx="63.6" cy="49.4" rx="7" ry="4.4" fill="#6A4532" opacity="0.35"/>
    <ellipse cx="90" cy="47.2" rx="5" ry="4" fill="#6A4532" opacity="0.35"/>
  </g>
  <!-- lash lines -->
  <path d="M54.8 54.2C58 58.6 68 58.8 71.4 54.4" stroke="#2A1A12" stroke-width="1.9" stroke-linecap="round" fill="none"/>
  <path d="M55.6 55.4L53.4 57.2" stroke="#2A1A12" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M83.8 51.8C86.2 55.8 92.8 56 95 51.6" stroke="#2A1A12" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <path d="M94.4 53L96.2 54.6" stroke="#2A1A12" stroke-width="1.2" stroke-linecap="round"/>
</svg>
