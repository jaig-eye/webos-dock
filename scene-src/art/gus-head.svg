<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <title>Gus head and neck (pivot at 66,100)</title>
  <defs>
    <!-- the neck base fades out just above the shoulder line drawn in gus-body -->
    <linearGradient id="hW" gradientUnits="userSpaceOnUse" x1="61.3" y1="96.8" x2="65.3" y2="103.8">
      <stop offset="0" stop-color="#F2EDE4"/>
      <stop offset="1" stop-color="#F2EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hS" gradientUnits="userSpaceOnUse" x1="61.3" y1="96.8" x2="65.3" y2="103.8">
      <stop offset="0" stop-color="#D8D1C5"/>
      <stop offset="1" stop-color="#D8D1C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hC" gradientUnits="userSpaceOnUse" x1="61.3" y1="96.8" x2="65.3" y2="103.8">
      <stop offset="0" stop-color="#5B301F"/>
      <stop offset="1" stop-color="#5B301F" stop-opacity="0"/>
    </linearGradient>
    <!-- solid underlay only where the neck is fully opaque, so the fading bands never stack -->
    <clipPath id="hSolid"><polygon points="0,0 100,0 100,74.7 0,131.8"/></clipPath>
  </defs>

  <!-- S-curved neck: white front, cool shade, chestnut hindneck stripe -->
  <path clip-path="url(#hSolid)" fill="#F2EDE4" d="M60,52 C59,60 51,66 49,75 C47,85 49,97 54,108 L80,108 C77,100 71,93 70,86 C69,78 74,72 79,67 C85,61 89,56 88,48 Z"/>
  <path fill="url(#hW)" d="M60,52 C59,60 51,66 49,75 C47,85 49,97 54,108 L68,108 C65,100 58,93 57,86 C57,76 62,70 67,64.5 C71,60 74,56 74,52 Z"/>
  <path fill="#FBF6EC" d="M54,66 C51.4,70 49.8,74 49.2,78.4 C48.6,84 49,89 50.4,94 C50.4,88 50.6,83 51.4,78.6 C52,74.4 53,70 54,66 Z"/>
  <path fill="url(#hS)" d="M74,52 C74,56 71,60 67,64.5 C62,70 57,76 57,86 C58,93 65,100 68,108 L73,108 C70,100 64,93 63,86 C62,77 67,71 72,66 C77,61 81,57 81,50 Z"/>
  <path fill="url(#hC)" d="M88,48 C89,56 85,61 79,67 C74,72 69,78 70,86 C71,93 77,100 80,108 L73,108 C70,100 64,93 63,86 C62,77 67,71 72,66 C77,61 81,57 81,50 Z"/>
  <path fill="#74412A" d="M81.6,53 C81.8,58 79.6,62.6 75.6,67 C79.4,64.4 82.8,59.6 83.8,53.6 Z"/>
  <!-- shadow the head throws on the top of the neck -->
  <path fill="#D3CBBE" d="M60,52 C64,58 72,60.4 80,58.4 C84,57.4 86.6,55.4 88,52 L88,48 C80,52 68,53 60,52 Z"/>

  <!-- long pale hooked bill, grey pouch tucked under it -->
  <g transform="translate(63 42) rotate(-36)">
    <path fill="#6E6C6D" d="M7,6 C-6,5.6 -28,4.8 -48,4 C-40,8.4 -29,12 -17,12.8 C-7,13.4 1,12.6 7,11 Z"/>
    <path fill="#5A585B" d="M7,11 C1,12.6 -7,13.4 -17,12.8 C-29,12 -40,8.4 -48,4 C-36,7.4 -26,9.6 -16,10.2 C-6,10.6 1,10.2 7,9 Z"/>
    <path fill="#C4B595" d="M8,3.6 C-12,2.2 -40,1.4 -59,1.8 C-57.6,3.4 -55.6,4.2 -53.5,4.2 C-40,4.4 -14,5.4 7.5,7 Z"/>
    <path fill="#DACDAF" d="M6,-6.8 C-10,-6 -40,-5.2 -58,-4.4 C-62,-4.2 -64.6,-2.6 -64.6,0.6 C-64.6,3 -63.6,4.6 -62.5,5.2 C-62.2,3.4 -61.5,2.2 -59.8,1.7 C-40,1.6 -12,2.3 8,3.8 Z"/>
    <path fill="#CDBF9F" d="M6,-0.4 C-16,-1 -38,-1.2 -57,-0.8 C-58.6,0 -59.4,1 -59.8,1.7 C-40,1.6 -12,2.3 8,3.8 Z"/>
    <path fill="#EEE5CF" d="M5,-6.5 C-12,-5.7 -40,-4.9 -56.5,-4.2 C-56.8,-3.4 -56.4,-3 -55.6,-2.9 C-40,-3.4 -14,-4.1 5,-4.6 Z"/>
    <path fill="none" stroke="#B9AB8C" stroke-width=".9" stroke-linecap="round" d="M4,-0.6 C-16,-1.2 -38,-1.4 -55,-1"/>
    <path fill="#C98F62" d="M-58,-4.4 C-62,-4.2 -64.6,-2.6 -64.6,0.6 C-64.6,3 -63.6,4.6 -62.5,5.2 C-62.2,3.4 -61.5,2.2 -59.8,1.7 C-59,0 -58.4,-2.4 -58,-4.4 Z"/>
    <path fill="#E0AE80" d="M-61.6,-3.7 C-63.1,-2.9 -63.8,-1.4 -63.7,0.1 C-63,-1.2 -62.4,-2.5 -61.6,-3.7 Z"/>
  </g>

  <!-- head -->
  <path fill="#F3EFE7" d="M60,42 C60,33 67,28 76,28 C85,28 91,34 91,42 C91,49 87,54 82,56 C75,58 66,56 62,51 C60.6,48.5 60,45 60,42 Z"/>
  <path fill="#D9D2C7" d="M91,42 C91,49 87,54 82,56 C75,58 66,56 62,51 C68,53.4 76,53.4 82,51 C87,49 90,46 91,42 Z"/>
  <!-- pale-yellow crown -->
  <path fill="#EFD98C" d="M61.3,37.5 C62.8,31.2 69,28 76,28 C83,28 88.8,31.6 90.5,37.4 C85.5,34.6 79.5,33.6 73.5,33.8 C68.5,34 64.5,35.4 61.3,37.5 Z"/>
  <path fill="#F8EAB8" d="M67,31 C71,29.2 77,28.9 82,29.8 C78,30.4 72,30.8 67,31 Z"/>
  <!-- bare facial skin, and the gape running back under the eye -->
  <path fill="#DCCBB9" d="M60.4,39.6 C63.5,37.8 67.5,37.2 70,37.8 C72.4,38.6 73.4,40.8 72.8,42.8 C70.4,44.4 65.4,45.2 61.2,45.4 C60.5,43.6 60.3,41.4 60.4,39.6 Z"/>
  <path fill="none" stroke="#B7A48D" stroke-width=".9" stroke-linecap="round" d="M61,46.4 C63.4,45.4 65.8,44.6 68.4,43.8"/>

  <!-- pale eye under a heavy, deadpan lid -->
  <ellipse cx="69" cy="39.6" rx="4.3" ry="3.8" fill="#C9B6A3"/>
  <circle cx="69" cy="39.6" r="3" fill="#EEE4C2"/>
  <circle cx="68.2" cy="40.2" r="1.45" fill="#1F1A15"/>
  <circle cx="67.7" cy="40" r=".55" fill="#FFFFFF"/>
  <path fill="#E4DACC" d="M64.6,39.4 C64.6,35.6 67,34.4 69,34.4 C71.4,34.4 73.5,35.8 73.5,39 C70.6,38.9 67.6,39.1 64.6,39.4 Z"/>
  <path fill="none" stroke="#6E655B" stroke-width="1" stroke-linecap="round" d="M64.9,39.4 C67.8,39.1 70.8,38.9 73.3,39"/>
</svg>
